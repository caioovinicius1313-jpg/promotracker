<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caça-Promo</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #14181f; --muted: #667085; --line: #e4e7ec;
    --accent: #2563eb; --good: #087443; --good-bg: #dcfae6; --warn: #b54708; --danger: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --card: #181c22; --text: #eceff3; --muted: #98a2b3; --line: #2a303a;
            --accent: #6ea0ff; --good: #75e0a7; --good-bg: #0b3a24; --warn: #fdb022; --danger: #f97066; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  h1 { font-size: 1.4rem; margin: 0; }
  .sub { color: var(--muted); font-size: .85rem; }
  .toolbar { display: flex; gap: 8px; }
  button, input, textarea { font: inherit; color: inherit; }
  button { border: 1px solid var(--line); background: var(--card); padding: 8px 12px; border-radius: 8px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.link { border: 0; background: none; color: var(--muted); padding: 4px 6px; font-size: .85rem; }
  button.link:hover { color: var(--accent); }
  button.link.del:hover { color: var(--danger); }
  button:disabled { opacity: .6; cursor: default; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .name { font-weight: 600; font-size: 1.05rem; }
  .notes { color: var(--muted); font-size: .85rem; margin-top: 2px; }
  .best { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 12px 0 4px; }
  .price { font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .badge { font-size: .75rem; padding: 2px 8px; border-radius: 99px; background: var(--good-bg); color: var(--good); font-weight: 600; }
  .store { color: var(--muted); }
  a { color: var(--accent); }
  .summary { font-size: .9rem; color: var(--muted); margin: 6px 0; }
  details { margin-top: 8px; font-size: .9rem; }
  summary { cursor: pointer; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  td { padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; }
  td.p { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; font-size: .8rem; color: var(--muted); flex-wrap: wrap; }
  .err { color: var(--danger); font-size: .85rem; }
  .spark { color: var(--accent); }
  .tabs { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
  .tab { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 14px; color: var(--muted); }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .sform { display: flex; gap: 8px; margin-bottom: 14px; }
  .sform input { flex: 1; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent);
          border-radius: 50%; animation: sp 1s linear infinite; vertical-align: -2px; margin-right: 8px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); width: min(460px, 92vw); padding: 18px; max-height: 90vh; overflow: auto; }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 4px; }
  label.check { display: flex; gap: 8px; align-items: center; color: var(--text); }
  label.check input { width: auto; }
  input, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .inline { display: flex; gap: 8px; margin-top: 8px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
           padding: 8px 14px; border-radius: 8px; font-size: .9rem; display: none; max-width: 90vw; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Caça-Promo</h1>
      <div class="sub" id="status">Carregando…</div>
    </div>
    <div class="toolbar">
      <button id="btnCfg" title="Configurações" aria-label="Configurações">⚙︎</button>
      <button id="btnAdd">+ Produto</button>
      <button id="btnRun" class="primary">Buscar tudo agora</button>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="watch" aria-selected="true">Acompanhando</button>
    <button class="tab" role="tab" data-tab="search" aria-selected="false">Pesquisar</button>
  </nav>
  <div id="list"></div>
  <section id="pane-search" hidden>
    <form class="sform" id="formSearch">
      <input id="sQuery" required maxlength="200" placeholder="Nome do produto, ex.: Ryzen 7 7800X3D" aria-label="Produto a pesquisar">
      <button class="primary" id="sBtn" type="submit">Pesquisar</button>
    </form>
    <div id="sResult"></div>
  </section>
</main>

<dialog id="dlgAdd">
  <form method="dialog" id="formAdd">
    <strong>Novo produto</strong>
    <label for="fName">Nome (quanto mais específico, melhor)</label>
    <input id="fName" required maxlength="120" placeholder="Ex.: SSD Kingston NV3 1TB NVMe">
    <label for="fNotes">Observações (opcional)</label>
    <textarea id="fNotes" rows="2" maxlength="300" placeholder="Só para você lembrar"></textarea>
    <label for="fTarget">Preço-alvo em R$ (opcional)</label>
    <input id="fTarget" type="number" min="0" step="0.01" inputmode="decimal">
    <div class="actions">
      <button type="button" id="addCancel">Cancelar</button>
      <button class="primary" type="submit">Adicionar e buscar</button>
    </div>
  </form>
</dialog>

<dialog id="dlgCfg">
  <form method="dialog" id="formCfg">
    <strong>Configurações</strong>
    <label for="cKey">Chave do Serper (grátis em <a href="https://serper.dev" target="_blank" rel="noopener noreferrer">serper.dev</a>)</label>
    <input id="cKey" type="password" autocomplete="off" placeholder="Cole aqui a chave">
    <p class="sub">Fica salva só neste navegador, nunca vai para o GitHub.</p>
    <label class="check"><input type="checkbox" id="cAuto"> Atualizar sozinho 1x por dia ao abrir o site</label>
    <label class="check"><input type="checkbox" id="cTrustedOnly"> Só mostrar lojas confiáveis</label>
    <label for="cTrusted">Lojas confiáveis (uma por linha)</label>
    <textarea id="cTrusted" rows="6"></textarea>
    <div class="inline"><button type="button" id="btnTrustedReset">Restaurar lista padrão</button></div>
    <label for="cMinRating">Nota mínima do produto (0 a 5; 0 = ignorar)</label>
    <input id="cMinRating" type="number" min="0" max="5" step="0.1">
    <label class="check"><input type="checkbox" id="cReqRating"> Descartar produtos sem avaliação</label>
    <label>Backup (seus dados ficam só neste navegador)</label>
    <div class="inline">
      <button type="button" id="btnExport">Exportar</button>
      <button type="button" id="btnImport">Importar</button>
      <input type="file" id="fileImport" accept="application/json" hidden>
    </div>
    <div class="actions">
      <button type="button" id="cfgCancel">Cancelar</button>
      <button class="primary" type="submit">Salvar</button>
    </div>
  </form>
</dialog>
<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = (u) => (/^https?:\/\//i.test(u) ? esc(u) : "#");
const fmtDate = (iso) => (iso ? iso.split("-").reverse().join("/") : "—");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };

// <pure>
const brl = (n) => n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const tokens = (s) => new Set((norm(s).match(/[a-z0-9]+/g) || []).filter((t) => t.length > 1));
function parseBRL(txt) {
  let s = String(txt ?? "").replace(/[^\d,.]/g, "");
  if (!s) return null;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  else { const dots = (s.match(/\./g) || []).length; if (dots > 1 || (dots === 1 && s.split(".")[1].length === 3)) s = s.replace(/\./g, ""); }
  const v = parseFloat(s);
  return v > 0 ? v : null;
}
const median = (a) => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const DEFAULT_TRUSTED = ["Amazon", "Mercado Livre", "Magazine Luiza", "Magalu", "Americanas", "Submarino", "Shoptime",
  "Casas Bahia", "Ponto", "Carrefour", "Fast Shop", "Kabum", "Pichau", "Terabyte", "Girafa", "Kalunga",
  "Samsung", "Dell", "Lenovo", "LG", "Apple", "Havan", "Leroy Merlin", "Decathlon", "Netshoes", "Centauro"];
const squash = (s) => norm(s).replace(/[^a-z0-9]/g, "");
const isTrusted = (source, list) => { const n = squash(source); return list.some((t) => { const k = squash(t); return k && n.startsWith(k); }); };
function filterShopping(name, items, opts = {}) {
  const want = tokens(name);
  const fallback = "https://www.google.com/search?tbm=shop&hl=pt-BR&gl=br&q=" + encodeURIComponent(name);
  let c = [];
  for (const it of items || []) {
    const price = parseBRL(it.price), title = String(it.title || "");
    if (!price || !title) continue;
    if (want.size) { const have = tokens(title); let hit = 0; want.forEach((t) => { if (have.has(t)) hit++; }); if (hit / want.size < 0.6) continue; }
    if (/\b(usad[oa]|seminov[oa]|recondicionad[oa]|open box)\b/.test(norm(title))) continue;
    c.push({ store: String(it.source || "").slice(0, 60), title: title.slice(0, 160), price: Math.round(price * 100) / 100,
             url: /^https?:\/\//.test(it.link || "") ? it.link : fallback, condition: "novo",
             shipping: String(it.delivery || "").slice(0, 80), note: "",
             rating: parseFloat(it.rating) || null, ratingCount: /mil/i.test(String(it.ratingCount)) ? Math.round(parseFloat(String(it.ratingCount).replace(",", ".")) * 1000) || 0 : parseInt(String(it.ratingCount ?? "").replace(/\D/g, "")) || 0 });
  }
  if (c.length >= 4) { const m = median(c.map((x) => x.price)); c = c.filter((x) => x.price >= 0.5 * m); }
  const total = c.length;
  const useTrust = !!(opts.trusted && opts.trusted.length);
  if (useTrust) c = c.filter((x) => isTrusted(x.store, opts.trusted));
  if (opts.minRating > 0) c = c.filter((x) => {
    const has = x.rating && (x.ratingCount === 0 || x.ratingCount >= 3);  // nota com 1-2 avaliações não conta
    return has ? x.rating >= opts.minRating : !opts.requireRating;
  });
  const best = new Map();
  [...c].sort((a, b) => a.price - b.price).forEach((x) => { if (!best.has(x.store)) best.set(x.store, x); });
  const offers = [...best.values()].slice(0, 5);
  const filtered = useTrust || opts.minRating > 0;
  let summary;
  if (offers.length) summary = filtered ? `${c.length} de ${total} anúncios passaram no filtro de lojas e avaliação; preço mediano ${brl(median(c.map((x) => x.price)))}`
                                        : `${c.length} anúncios no Google Shopping; preço mediano ${brl(median(c.map((x) => x.price)))}`;
  else summary = total ? `Havia ${total} anúncios, mas nenhum de loja confiável ou com boa avaliação.` : "Nenhum anúncio relevante no Google Shopping.";
  return { offers, summary };
}
const STORE_DOMAINS = { kabum: "kabum.com.br", pichau: "pichau.com.br", terabyte: "terabyteshop.com.br", amazon: "amazon.com.br",
  mercadolivre: "mercadolivre.com.br", magazineluiza: "magazineluiza.com.br", magalu: "magazineluiza.com.br", americanas: "americanas.com.br",
  submarino: "submarino.com.br", shoptime: "shoptime.com.br", casasbahia: "casasbahia.com.br", ponto: "pontofrio.com.br",
  carrefour: "carrefour.com.br", fastshop: "fastshop.com.br", girafa: "girafa.com.br", kalunga: "kalunga.com.br", samsung: "samsung.com",
  dell: "dell.com", lenovo: "lenovo.com", lg: "lg.com", apple: "apple.com", havan: "havan.com.br", leroymerlin: "leroymerlin.com.br",
  decathlon: "decathlon.com.br", netshoes: "netshoes.com.br", centauro: "centauro.com.br" };
function storeDomain(store) { const n = squash(store), k = Object.keys(STORE_DOMAINS).find((x) => n.startsWith(x)); return k ? STORE_DOMAINS[k] : null; }
function pickDirect(organic, store, domain) {
  const n = squash(store);
  for (const r of organic || []) {
    let u; try { u = new URL(r.link); } catch { continue; }
    if (!/^https?:$/.test(u.protocol) || /\/(busca|search|categoria)\b|[?&]q=/i.test(u.pathname + u.search)) continue;
    const host = u.hostname.replace(/^www\./, "");
    if (domain) { if (host === domain || host.endsWith("." + domain)) return r.link; continue; }
    const label = squash(host.split(".")[0]);
    if (label.length >= 3 && (n.startsWith(label) || label.startsWith(n))) return r.link;
  }
  return null;
}
// </pure>

// ---- armazenamento local (por navegador) ----
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { toast("Não consegui salvar no navegador (aba anônima?)."); } },
};
let products = store.get("cp_products", []);
let deals = store.get("cp_deals", {});
let settings = Object.assign({ key: "", auto: true, trustedOnly: true, trusted: DEFAULT_TRUSTED, minRating: 4, requireRating: false }, store.get("cp_settings", {}));
let busy = false, lastSearch = null;

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = "none"), 4000);
}

// ---- busca (Serper / Google Shopping, direto do navegador) ----
async function serperSearch(name) {
  let res;
  try {
    res = await fetch("https://google.serper.dev/shopping", { method: "POST",
      headers: { "X-API-KEY": settings.key, "Content-Type": "application/json" },
      body: JSON.stringify({ q: name, gl: "br", hl: "pt-br", num: 40 }) });
  } catch { const e = new Error("Não consegui falar com o Serper (sem internet ou bloqueio do navegador)."); e.fatal = true; throw e; }
  if ([401, 402, 403].includes(res.status)) { const e = new Error("Chave do Serper inválida ou sem créditos."); e.fatal = true; throw e; }
  if (!res.ok) throw new Error("O Serper respondeu com erro " + res.status + ".");
  const data = await res.json();
  return filterShopping(name, data.shopping, { trusted: settings.trustedOnly ? settings.trusted : null, minRating: settings.minRating, requireRating: settings.requireRating });
}

const isGoogle = (u) => { try { return /(^|\.)google\./.test(new URL(u).hostname); } catch { return false; } };
async function resolveDirect(o) {
  const domain = storeDomain(o.store);
  const res = await fetch("https://google.serper.dev/search", { method: "POST",
    headers: { "X-API-KEY": settings.key, "Content-Type": "application/json" },
    body: JSON.stringify({ q: domain ? `site:${domain} ${o.title}` : `${o.title} ${o.store}`, gl: "br", hl: "pt-br", num: 10 }) });
  if (!res.ok) throw new Error("Serper " + res.status);
  return pickDirect((await res.json()).organic, o.store, domain);
}

// Ao clicar numa oferta, troca o link do Google Shopping pelo link direto da loja (1 busca extra, 1x por oferta).
document.addEventListener("click", async (e) => {
  const a = e.target.closest("a[data-pid]");
  if (!a || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || !settings.key) return;
  const offers = a.dataset.pid === "search" ? lastSearch?.r.offers : deals[a.dataset.pid]?.offers;
  const o = offers?.[+a.dataset.oi];
  if (!o || o.direct || o.directTried || !isGoogle(o.url)) return;   // já é direto ou já resolvido: segue o link normal
  e.preventDefault();
  const w = window.open("", "_blank"); if (w) w.opener = null;
  let url = null;
  try { url = await resolveDirect(o); } catch { /* usa o link do Google */ }
  o.directTried = true; if (url) { o.direct = url; a.href = url; }
  if (a.dataset.pid !== "search") store.set("cp_deals", deals);
  const target = url || o.url;
  if (w) w.location = target;
  else toast(url ? "Link direto pronto, clique de novo." : "Não achei o link direto da loja.");
});

function applyResult(id, r) {
  const e = deals[id] || { history: [] };
  delete e.error;
  e.updated = todayStr(); e.offers = r.offers; e.summary = r.summary;
  if (r.offers.length) e.history = (e.history || []).filter((h) => h.d !== e.updated).concat({ d: e.updated, p: r.offers[0].price }).slice(-90);
  deals[id] = e; store.set("cp_deals", deals);
}

function setBusy(on, label) {
  busy = on;
  document.querySelectorAll("#btnRun, #sBtn, [data-upd]").forEach((b) => (b.disabled = on));
  $("#btnRun").textContent = on ? "Buscando…" : "Buscar tudo agora";
  if (!on) render();
}

async function runList(list) {
  if (busy) return;
  if (!settings.key) { openSettings(); toast("Cole sua chave do Serper primeiro."); return; }
  if (!list.length) { toast("Nenhum produto para buscar."); return; }
  setBusy(true);
  let ok = 0;
  for (let i = 0; i < list.length; i++) {
    $("#status").textContent = `Buscando ${i + 1}/${list.length}: ${list[i].name}`;
    try { applyResult(list[i].id, await serperSearch(list[i].name)); ok++; }
    catch (e) {
      const en = deals[list[i].id] || { history: [] }; en.error = e.message; deals[list[i].id] = en; store.set("cp_deals", deals);
      if (e.fatal) { toast(e.message); break; }
    }
  }
  setBusy(false);
  toast(`${ok}/${list.length} produtos atualizados.`);
}

// ---- tela ----
function spark(hist) {
  if (!hist || hist.length < 2) return "";
  const w = 120, h = 32, ps = hist.map((x) => x.p), min = Math.min(...ps), max = Math.max(...ps), rng = max - min || 1;
  const pts = ps.map((p, i) => `${(i / (ps.length - 1)) * w},${h - 3 - ((p - min) / rng) * (h - 6)}`).join(" ");
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Histórico do menor preço, ${hist.length} buscas">
    <polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

const rate = (o) => (o.rating ? ` · ★ ${String(o.rating).replace(".", ",")}${o.ratingCount ? ` (${o.ratingCount})` : ""}` : "");
const lnk = (o, pid, i) => `href="${safeUrl(o.direct || o.url)}" data-pid="${esc(pid)}" data-oi="${i}" target="_blank" rel="noopener noreferrer"`;
function offersHtml(best, offers, open, pid) {
  return `<div><a ${lnk(best, pid, 0)}>${esc(best.title || "Ver oferta")}</a>
      <span class="store">· ${esc(best.store)}${esc(rate(best))}</span></div>
    ${best.shipping || best.note ? `<div class="sub">${esc([best.shipping, best.note].filter(Boolean).join(" · "))}</div>` : ""}
    ${offers.length > 1 ? `<details ${open ? "open" : ""}><summary>Outras ofertas (${offers.length - 1})</summary><table>${offers.slice(1).map((o, i) =>
      `<tr><td><a ${lnk(o, pid, i + 1)}>${esc(o.store)}</a><div class="sub">${esc(o.title)}${esc(rate(o))}</div></td><td class="p">${brl(o.price)}</td></tr>`).join("")}</table></details>` : ""}`;
}

function render() {
  const dates = Object.values(deals).map((d) => d.updated).filter(Boolean).sort();
  $("#status").textContent = dates.length ? "Última busca: " + fmtDate(dates[dates.length - 1]) : "Nenhuma busca feita ainda";
  const banner = settings.key ? "" : `<div class="card">Para buscar preços, cole sua chave grátis do Serper em ⚙︎ (cadastro em <a href="https://serper.dev" target="_blank" rel="noopener noreferrer">serper.dev</a>, 2.500 buscas, sem cartão).</div>`;
  if (!products.length) { $("#list").innerHTML = banner + '<div class="empty">Nenhum produto. Clique em “+ Produto”.</div>'; return; }
  $("#list").innerHTML = banner + products.map((p) => {
    const d = deals[p.id] || {}, offers = d.offers || [], best = offers[0];
    const hist = d.history || [], prev = hist.length > 1 ? hist[hist.length - 2].p : null;
    const hit = best && p.target_price && best.price <= p.target_price;
    const lowest = best && hist.length > 1 && best.price <= Math.min(...hist.map((h) => h.p));
    let body;
    if (d.error && !best) body = `<div class="err">Falha na última busca: ${esc(d.error)}</div>`;
    else if (!d.updated) body = '<div class="summary">Ainda sem busca. Clique em “Buscar tudo agora”.</div>';
    else if (!best) body = '<div class="summary">Nenhuma oferta confiável encontrada. Tente um nome mais específico.</div>';
    else {
      const delta = prev ? best.price - prev : 0;
      body = `<div class="best"><span class="price">${brl(best.price)}</span>
          ${hit ? '<span class="badge">Abaixo do alvo</span>' : ""}${lowest ? '<span class="badge">Menor preço do histórico</span>' : ""}
          ${delta ? `<span class="sub">${delta < 0 ? "▼" : "▲"} ${brl(Math.abs(delta))} vs. busca anterior</span>` : ""}</div>
        ${offersHtml(best, offers, false, p.id)}${d.summary ? `<div class="summary">${esc(d.summary)}</div>` : ""}
        ${d.error ? `<div class="err">Última tentativa falhou: ${esc(d.error)}</div>` : ""}`;
    }
    return `<article class="card">
      <div class="row"><div><div class="name">${esc(p.name)}</div>${p.notes ? `<div class="notes">${esc(p.notes)}</div>` : ""}</div>${spark(hist)}</div>
      ${body}
      <div class="meta"><span>${p.target_price ? "Alvo: " + brl(p.target_price) : "Sem preço-alvo"} · Atualizado: ${fmtDate(d.updated)}</span>
        <span><button class="link" data-upd="${esc(p.id)}" ${busy ? "disabled" : ""}>Atualizar</button>
        <button class="link del" data-del="${esc(p.id)}">Remover</button></span></div>
    </article>`;
  }).join("");
}

function addProduct(p) { products = [...products, p]; store.set("cp_products", products); }
const makeId = (name) => name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 50) + "-" + Date.now().toString(36);

$("#list").onclick = (e) => {
  const upd = e.target.dataset?.upd, del = e.target.dataset?.del;
  if (upd) runList(products.filter((p) => p.id === upd));
  if (del) {
    const p = products.find((x) => x.id === del);
    if (!confirm(`Remover “${p.name}”?`)) return;
    products = products.filter((x) => x.id !== del); delete deals[del];
    store.set("cp_products", products); store.set("cp_deals", deals); render();
  }
};

// ---- adicionar produto ----
$("#btnAdd").onclick = () => $("#dlgAdd").showModal();
$("#addCancel").onclick = () => $("#dlgAdd").close();
$("#formAdd").onsubmit = () => {
  const name = $("#fName").value.trim(), target = parseFloat($("#fTarget").value);
  const p = { id: makeId(name), name, notes: $("#fNotes").value.trim() || undefined, target_price: target > 0 ? target : undefined };
  addProduct(p); $("#formAdd").reset(); render(); showTab("watch");
  runList([p]);
};
$("#btnRun").onclick = () => runList(products);

// ---- configurações ----
function openSettings() {
  $("#cKey").value = settings.key; $("#cAuto").checked = settings.auto;
  $("#cTrustedOnly").checked = settings.trustedOnly; $("#cTrusted").value = settings.trusted.join("\n");
  $("#cMinRating").value = settings.minRating; $("#cReqRating").checked = settings.requireRating;
  $("#dlgCfg").showModal();
}
$("#btnTrustedReset").onclick = () => { $("#cTrusted").value = DEFAULT_TRUSTED.join("\n"); };
$("#btnCfg").onclick = openSettings;
$("#cfgCancel").onclick = () => $("#dlgCfg").close();
$("#formCfg").onsubmit = () => {
  settings = { key: $("#cKey").value.trim(), auto: $("#cAuto").checked, trustedOnly: $("#cTrustedOnly").checked,
    trusted: $("#cTrusted").value.split("\n").map((x) => x.trim()).filter(Boolean),
    minRating: Math.min(5, Math.max(0, parseFloat($("#cMinRating").value) || 0)), requireRating: $("#cReqRating").checked };
  store.set("cp_settings", settings); render(); toast("Configurações salvas.");
};
$("#btnExport").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ products, deals }, null, 2)], { type: "application/json" }));
  a.download = "cacapromo-backup.json"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$("#btnImport").onclick = () => $("#fileImport").click();
$("#fileImport").onchange = async (e) => {
  try {
    const d = JSON.parse(await e.target.files[0].text());
    if (!Array.isArray(d.products) || !d.products.every((p) => typeof p.id === "string" && typeof p.name === "string") || typeof d.deals !== "object") throw 0;
    products = d.products; deals = d.deals; store.set("cp_products", products); store.set("cp_deals", deals);
    render(); toast("Backup importado."); $("#dlgCfg").close();
  } catch { toast("Arquivo de backup inválido."); }
  e.target.value = "";
};

// ---- aba Pesquisar ----
function showTab(name) {
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", t.dataset.tab === name));
  $("#list").hidden = name !== "watch"; $("#pane-search").hidden = name !== "search";
}
document.querySelector(".tabs").onclick = (e) => { const t = e.target.dataset?.tab; if (t) showTab(t); };

function showResult(q, r) {
  const box = $("#sResult"), offers = r.offers, best = offers[0];
  if (!best) { lastSearch = null; box.innerHTML = `<div class="card">Nenhuma oferta confiável para “${esc(q)}”. Tente um nome mais específico.</div>`; return; }
  lastSearch = { q, r };
  const tracked = products.some((p) => p.name.toLowerCase() === q.toLowerCase());
  box.innerHTML = `<article class="card">
    <div class="name">${esc(q)}</div>
    <div class="best"><span class="price">${brl(best.price)}</span><span class="badge">Menor preço encontrado</span></div>
    ${offersHtml(best, offers, true, "search")}${r.summary ? `<div class="summary">${esc(r.summary)}</div>` : ""}
    <div class="meta"><span>Pesquisado agora</span>
      <button id="btnTrack" ${tracked ? "disabled" : ""}>${tracked ? "Já acompanhando" : "+ Acompanhar"}</button></div>
  </article>`;
}

$("#formSearch").onsubmit = async (e) => {
  e.preventDefault();
  if (busy) return;
  if (!settings.key) { openSettings(); toast("Cole sua chave do Serper primeiro."); return; }
  const q = $("#sQuery").value.trim(), box = $("#sResult");
  setBusy(true);
  box.innerHTML = `<div class="card"><span class="spin"></span>Pesquisando “${esc(q)}”…</div>`;
  try { showResult(q, await serperSearch(q)); }
  catch (err) { box.innerHTML = `<div class="card err">${esc(err.message)}</div>`; }
  setBusy(false);
};

$("#sResult").onclick = (e) => {
  if (e.target.id !== "btnTrack" || !lastSearch) return;
  const p = { id: makeId(lastSearch.q), name: lastSearch.q };
  addProduct(p); applyResult(p.id, lastSearch.r); render();
  e.target.textContent = "Já acompanhando"; e.target.disabled = true; toast("Adicionado à lista.");
};

// ---- início ----
render();
if (settings.key && settings.auto && products.length) {
  const stale = products.filter((p) => deals[p.id]?.updated !== todayStr());
  if (stale.length) runList(stale);
}
</script>
</body>
</html>
