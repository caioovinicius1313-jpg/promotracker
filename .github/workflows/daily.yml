name: Busca diária de promoções

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC = 07:00 em Brasília
  workflow_dispatch:        # botão "Run workflow" manual
  push:
    paths:
      - products.json       # roda ao adicionar/remover produto

permissions:
  contents: write

concurrency:
  group: deals
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Buscar promoções
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TZ: America/Sao_Paulo
        run: python search_deals.py

      - name: Salvar resultado
        run: |
          git config user.name "promo-bot"
          git config user.email "promo-bot@users.noreply.github.com"
          git add data/deals.json
          git diff --staged --quiet || git commit -m "Atualiza promoções $(TZ=America/Sao_Paulo date +%F)"
          git pull --rebase
          git push
