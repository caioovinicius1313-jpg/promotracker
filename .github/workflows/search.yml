name: Pesquisa avulsa

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Produto a pesquisar"
        required: true
      request_id:
        description: "ID da requisição (gerado pelo site)"
        required: true

permissions:
  contents: write

concurrency:
  group: search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pesquisar
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QUERY: ${{ inputs.query }}
          RID: ${{ inputs.request_id }}
          TZ: America/Sao_Paulo
        run: python search_deals.py --query "$QUERY" "$RID"

      - name: Salvar resultado
        run: |
          git config user.name "promo-bot"
          git config user.email "promo-bot@users.noreply.github.com"
          git add data/search.json
          git commit -m "Resultado da pesquisa avulsa" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 3; done
